<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="A special romantic proposal for Shreya — Will You Date Me? A luxury digital love experience." />
  <meta name="theme-color" content="#ec4899" />
  <title>Will You Date Me, Shreya? ❤️</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loading-screen">
    <div class="loading-heart"></div>
    <p class="loading-text">Preparing something special...</p>
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- ===== BACKGROUND PARTICLES ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== MUSIC TOGGLE ===== -->
  <button id="music-toggle" class="muted" aria-label="Toggle music" title="Toggle romantic music">
    🔇
  </button>

  <!-- ===== MAIN CONTENT ===== -->
  <div id="main-content">
    <section class="hero-section">
      <h1 class="hero-greeting">Dear Shreya ❤️</h1>
      <p class="hero-message">
        You are the most beautiful person in my life. Every moment with you feels magical, 
        and every smile of yours brightens my day.
      </p>

      <!-- ===== PROPOSAL CARD ===== -->
      <div class="proposal-card" id="proposal-card">
        <h2 class="proposal-question">Will You Date Me? 💕</h2>
        <p class="proposal-from">
          <span>From:</span>
          Cutie ❤️
        </p>

        <div id="no-message" class="no-message" style="display: none;"></div>

        <div class="buttons-container" id="buttons-container">
          <button class="btn btn-yes" id="btn-yes">YES ❤️</button>
          <button class="btn btn-no" id="btn-no">NO 😢</button>
        </div>
      </div>
    </section>
  </div>

  <!-- ===== CELEBRATION OVERLAY ===== -->
  <div id="celebration-overlay">
    <canvas id="confetti-canvas"></canvas>
    <div class="love-letter-modal" id="love-letter">
      <h2 class="letter-title">Thank You, Shreya ❤️</h2>
      <div class="letter-content" id="letter-content"></div>
      <div class="letter-hearts" id="letter-hearts" style="display:none;">💖💕💗💖💕</div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    Made with <span class="heart-icon">❤️</span> by Cutie for Shreya
  </footer>

  <script src="script.js"></script>
</body>
</html>
